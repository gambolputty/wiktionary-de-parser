[project]
name = "wiktionary-de-parser"
version = "0.14.2"
description = "Extracts data from German Wiktionary dump files."
authors = [{ name = "Gregor Weichbrodt", email = "gregorweichbrodt@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "wiktionary",
    "xml",
    "parser",
    "data-extraction",
    "german",
    "nlp",
]
classifiers = [
    "Programming Language :: Python :: 3.7",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: German",
    "Topic :: Text Processing :: Markup :: XML",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "lxml>=6.1.1,<7",
    "mwparserfromhell>=0.7.2,<0.8",
    "pydantic>=2.13.4,<3",
    "requests>=2.34.2,<3",
    "tqdm>=4.67.3,<5",
    "wikitextparser>=0.56.4,<0.57",
]

[project.urls]
Homepage = "https://github.com/gambolputty/wiktionary-de-parser"
Repository = "https://github.com/gambolputty/wiktionary-de-parser"
"Bug Tracker" = "https://github.com/gambolputty/wiktionary-de-parser/issues"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0,<8",
    "ipywidgets>=8.1.8,<9",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.14,<0.16",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "wiktionary_de_parser"
module-root = ""
source-include = [
    "CHANGELOG.md",
    "LICENSE.txt",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = [".vscode"]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "B", "W"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 150
